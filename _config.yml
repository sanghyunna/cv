# Site settings
title: "Sanghyun Na"
description: "Sanghyun Na - Curriculum vitae"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Sanghyun Na"
resume_title:                   "Passionate researcher"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "na_sanghyun@naver.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "000-0000"
resume_contact_address:         "84, Heukseok-ro, Dongjak-gu, Seoul, Republic of Korea"

resume_header_contact_info:     "84, Heukseok-ro, Dongjak-gu, Seoul, Republic of Korea • 000-0000 • na_sanghyun@naver.com"
display_header_contact_info:    "false"

resume_header_intro: "<p>Undergraduate researcher at MULTILAB, Chung-Ang University, with research interests in representation learning, MLLM interpretability, and model compression</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      false
resume_section_education:       true
resume_section_projects:        false
resume_section_skills:          false
resume_section_recognition:     false
resume_section_links:           false
resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/sanghyunna/cv"
  # resume_twitter_url:           "http://twitter.com/jglovier"
  # resume_dribbble_url:          "https://dribbble.com/jag"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/sanghyunna"
  # resume_instagram_url:         "insert your Instagram URL here"
  # resume_website_url:           "http://joelglovier.com"
  # resume_medium_url:            "https://medium.com/@jglovier"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

